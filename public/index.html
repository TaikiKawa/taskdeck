<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>taskdeck</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1c1e21; --muted: #6b7280;
    --border: #e2e4e8; --accent: #4f6ef7; --accent-soft: #eef1fe;
    --danger: #d64545; --done: #2e9e5b; --warn: #b97d10;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d; --panel: #1f2229; --text: #e8eaed; --muted: #9aa0a8;
      --border: #2e323b; --accent: #7b93ff; --accent-soft: #262c42;
      --danger: #e06c6c; --done: #4cc27e; --warn: #e0a94f;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 20px;
    border-bottom: 1px solid var(--border); background: var(--panel);
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .5px; }
  header h1 span { color: var(--accent); }
  select, input[type=text] {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font-size: 13px; outline: none;
    font-family: inherit;
  }
  input[type=text]:focus, select:focus { border-color: var(--accent); }
  #quickAdd { flex: 1; min-width: 200px; }
  #layout { flex: 1; display: flex; min-height: 0; }
  main {
    flex: 1; display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 14px; padding: 14px 20px; overflow: auto; min-width: 0;
  }
  .col {
    background: transparent; border-radius: 12px; display: flex;
    flex-direction: column; min-width: 200px; min-height: 0;
  }
  .col-head {
    display: flex; align-items: center; gap: 8px; padding: 4px 6px 10px;
    font-size: 13px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .8px;
  }
  .col-head .count {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 1px 8px; font-size: 12px;
  }
  .col-head .spacer { flex: 1; }
  .col-add {
    background: var(--panel); border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; width: 24px; height: 24px; font-size: 15px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .col-add:hover { color: var(--accent); border-color: var(--accent); }
  .col-body {
    flex: 1; display: flex; flex-direction: column; gap: 8px;
    padding: 6px; border-radius: 12px; min-height: 80px; overflow-y: auto;
  }
  .col-body.dragover { background: var(--accent-soft); }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow);
    cursor: pointer; user-select: none;
  }
  .card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .card.dragging { opacity: .4; }
  .card.selected { border-color: var(--accent); }
  .card .title {
    font-size: 14px; line-height: 1.45; word-break: break-word;
    border-radius: 6px; padding: 1px 3px; margin: -1px -3px;
  }
  .card .title:hover { background: var(--accent-soft); }
  .card .title[contenteditable] {
    background: var(--bg); outline: 2px solid var(--accent); cursor: text;
    user-select: text;
  }
  .card.done .title { color: var(--muted); text-decoration: line-through; }
  .card .notes {
    font-size: 12px; color: var(--muted); margin-top: 4px;
    white-space: pre-wrap; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .meta {
    display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 11px;
    min-height: 22px;
  }
  .badge {
    background: var(--accent-soft); color: var(--accent);
    border-radius: 6px; padding: 2px 7px; font-weight: 600;
  }
  .chip { border-radius: 6px; padding: 2px 7px; font-weight: 600; font-size: 11px; }
  .chip.p-high { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
  .chip.p-medium { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .chip.p-low { background: var(--accent-soft); color: var(--accent); }
  .chip.run-running {
    background: color-mix(in srgb, var(--done) 16%, transparent); color: var(--done);
    animation: run-pulse 1.4s ease-in-out infinite;
  }
  .chip.run-error { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
  .chip.run-done { background: color-mix(in srgb, var(--done) 16%, transparent); color: var(--done); }
  @keyframes run-pulse { 50% { opacity: .45; } }
  .meta .spacer { flex: 1; }
  .icon-btn {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 13px; padding: 2px 5px; border-radius: 6px; font-family: inherit;
  }
  .icon-btn:hover { color: var(--text); background: var(--accent-soft); }
  .icon-btn.del:hover { color: var(--danger); }
  .card .meta .icon-btn { opacity: 0; transition: opacity .12s; }
  .card:hover .meta .icon-btn, .card:focus-within .meta .icon-btn { opacity: 1; }
  .card.composer { cursor: auto; }
  .composer textarea {
    width: 100%; background: none; border: none; outline: none; color: var(--text);
    font-size: 14px; font-family: inherit; line-height: 1.45; resize: none;
    min-height: 40px; padding: 0;
  }

  /* ---- 詳細パネル (Notion風サイドピーク) ---- */
  #panel {
    width: 420px; max-width: 46vw; border-left: 1px solid var(--border);
    background: var(--panel); display: flex; flex-direction: column; min-height: 0;
  }
  #panel[hidden] { display: none; }
  .panel-head {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  .panel-head .spacer { flex: 1; }
  .panel-body { flex: 1; overflow-y: auto; padding: 18px 20px 30px; }
  #panelTitle {
    width: 100%; background: none; border: none; outline: none; color: var(--text);
    font-size: 20px; font-weight: 700; font-family: inherit; resize: none;
    line-height: 1.4; padding: 0; margin: 0 0 16px; overflow: hidden;
  }
  #panelTitle::placeholder { color: var(--muted); }
  .props {
    display: grid; grid-template-columns: 92px 1fr; gap: 8px 10px;
    align-items: center; margin-bottom: 20px;
  }
  .props .prop-label { font-size: 12px; color: var(--muted); }
  .notes-head { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
  .notes-view {
    min-height: 200px; font-size: 14px; line-height: 1.65; cursor: text;
    border-radius: 8px; padding: 6px 4px; word-break: break-word; outline: none;
    caret-color: var(--accent);
  }
  .notes-view:empty::before {
    content: "メモを書く…（Notionと同じ感覚でそのまま入力）";
    color: var(--muted); pointer-events: none;
  }
  .notes-view h1 { font-size: 20px; margin: 14px 0 6px; }
  .notes-view h2 { font-size: 17px; margin: 12px 0 5px; }
  .notes-view h3 { font-size: 15px; margin: 10px 0 4px; }
  .notes-view p { margin: 3px 0; }
  .notes-view ul, .notes-view ol { margin: 3px 0; padding-left: 22px; }
  .notes-view li { margin: 2px 0; }
  .notes-view code {
    background: var(--accent-soft); border-radius: 4px; padding: 1px 5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
  }
  .notes-view a { color: var(--accent); cursor: pointer; }
  .notes-view a:hover { text-decoration: underline; }
  .notes-view a.link-card {
    display: block; border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; margin: 6px 0; text-decoration: none;
    background: var(--bg); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  .notes-view a.link-card:hover { border-color: var(--accent); text-decoration: none; }
  .notes-view blockquote {
    margin: 4px 0; padding: 2px 0 2px 12px;
    border-left: 3px solid var(--border); color: var(--muted);
  }
  .notes-view .md-gap { height: 10px; }
  .notes-hint { font-size: 11px; color: var(--muted); margin-top: 10px; line-height: 1.6; }
  #linkPopup {
    position: fixed; z-index: 70; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; padding: 8px;
    box-shadow: 0 8px 30px rgba(0,0,0,.3);
  }
  #linkPopup[hidden] { display: none; }
  #linkPopup input { width: 280px; }

  /* ---- カードの … メニュー ---- */
  #cardMenu {
    position: fixed; z-index: 50; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,.25); padding: 4px; min-width: 150px;
  }
  #cardMenu[hidden] { display: none; }
  #cardMenu button {
    display: flex; align-items: center; gap: 8px; width: 100%;
    background: none; border: none; color: var(--text); font-size: 13px;
    font-family: inherit; padding: 7px 10px; border-radius: 6px; cursor: pointer;
    text-align: left;
  }
  #cardMenu button:hover { background: var(--accent-soft); }
  #cardMenu button.danger-item { color: var(--danger); }
  #cardMenu button.danger-item:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); }

  /* ---- 削除トースト ---- */
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,.3); padding: 10px 16px;
    display: flex; gap: 14px; align-items: center; font-size: 13px; z-index: 60;
    max-width: 80vw;
  }
  #toast[hidden] { display: none; }
  #toast .msg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #toast button {
    background: none; border: none; color: var(--accent); cursor: pointer;
    font-size: 13px; font-weight: 600; font-family: inherit; flex-shrink: 0;
  }

  dialog {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px; width: min(480px, 92vw);
    box-shadow: 0 10px 40px rgba(0,0,0,.3);
  }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  dialog input[type=text] {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px;
    font-size: 14px; font-family: inherit; outline: none;
  }
  .dialog-actions { display: flex; gap: 8px; margin-top: 18px; justify-content: flex-end; }
  button.primary {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 9px 18px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  button.ghost {
    background: none; border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 9px 14px; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  .empty { color: var(--muted); font-size: 12px; text-align: center; padding: 18px 0; }
</style>
</head>
<body>
<header>
  <h1>task<span>deck</span></h1>
  <select id="projectFilter" title="プロジェクト"></select>
  <button type="button" class="ghost" id="newProjectBtn" title="新しいグループを作成">＋ グループ</button>
  <form id="quickAddForm" style="display:contents">
    <input id="quickAdd" type="text" autocomplete="off" placeholder="タスクを追加（先頭に #プロジェクト名 でグループ指定）">
    <button type="submit" class="primary">＋ 追加</button>
  </form>
</header>
<div id="layout">
<main>
  <section class="col" data-status="todo">
    <div class="col-head">Todo <span class="count"></span><span class="spacer"></span><button class="col-add" title="このカラムにタスクを追加">＋</button></div>
    <div class="col-body"></div>
  </section>
  <section class="col" data-status="doing">
    <div class="col-head">Doing <span class="count"></span><span class="spacer"></span><button class="col-add" title="このカラムにタスクを追加">＋</button></div>
    <div class="col-body"></div>
  </section>
  <section class="col" data-status="done">
    <div class="col-head">Done <span class="count"></span><span class="spacer"></span><button class="col-add" title="このカラムにタスクを追加">＋</button></div>
    <div class="col-body"></div>
  </section>
</main>

<aside id="panel" hidden>
  <div class="panel-head">
    <button class="icon-btn" id="panelClose" title="閉じる (Esc)">✕</button>
    <span class="spacer"></span>
    <button class="icon-btn del" id="panelDelete" title="タスクを削除">🗑 削除</button>
  </div>
  <div class="panel-body">
    <textarea id="panelTitle" rows="1" placeholder="無題"></textarea>
    <div class="props">
      <span class="prop-label">ステータス</span>
      <select id="propStatus">
        <option value="todo">Todo</option>
        <option value="doing">Doing</option>
        <option value="done">Done</option>
      </select>
      <span class="prop-label">優先度</span>
      <select id="propPriority">
        <option value="">なし</option>
        <option value="high">高</option>
        <option value="medium">中</option>
        <option value="low">低</option>
      </select>
      <span class="prop-label">グループ</span>
      <input id="propProject" type="text">
    </div>
    <div class="notes-head">メモ</div>
    <div id="notesEditor" class="notes-view" contenteditable="true" spellcheck="false"></div>
    <div class="notes-hint">「# 」「- 」「1. 」で見出し・リスト、**太字**・*斜体*・`コード` は入力で変換。⌘B 太字 / ⌘I 斜体 / ⌘E コード / ⌘⇧S 打ち消し / ⌘K リンク / ⌘⌥1〜3 見出し / ⌘⌥0 本文。URL貼り付けでリンク、リンクはクリックで開く</div>
  </div>
</aside>
</div>

<div id="linkPopup" hidden>
  <input id="linkInput" type="text" placeholder="URLを入力して Enter" autocomplete="off">
</div>

<div id="cardMenu" hidden>
  <button id="menuDone">✓ 完了にする</button>
  <button id="menuDelete" class="danger-item">🗑 削除</button>
</div>

<div id="toast" hidden>
  <span class="msg"></span>
  <button id="toastUndo">元に戻す</button>
</div>

<dialog id="dispatchDialog">
  <form method="dialog" id="dispatchForm">
    <h3 style="margin:0 0 4px;font-size:15px;">🤖 Claude Codeに依頼</h3>
    <p id="dispatchTaskTitle" style="margin:6px 0 0;font-size:13px;color:var(--muted);"></p>
    <label>実行モード</label>
    <select id="dispatchSession" style="width:100%">
      <option value="new">新規セッションで実行</option>
      <option value="resume">登録元セッションの続きで実行（文脈を引き継ぐ）</option>
    </select>
    <label>作業ディレクトリ（このプロジェクトのリポジトリ）</label>
    <input type="text" id="dispatchCwd" required autocomplete="off" spellcheck="false"
           placeholder="/Users/you/dev/repo">
    <label>権限モード</label>
    <select id="dispatchMode" style="width:100%">
      <option value="safe">安全 — ファイル編集のみ自動許可 (acceptEdits)</option>
      <option value="full">全自動 — すべてのコマンドを許可（要注意）</option>
    </select>
    <p style="margin:10px 0 0;font-size:11px;color:var(--muted);line-height:1.6;">
      claude がバックグラウンドで実行され、進捗はカードのバッジと SSE で反映されます。
      完了・失敗時は実行ログがタスクのメモに追記されます。
    </p>
    <div class="dialog-actions">
      <button type="button" class="ghost" id="dispatchCancel">キャンセル</button>
      <button type="submit" class="primary">▶ 実行</button>
    </div>
  </form>
</dialog>

<dialog id="projectDialog">
  <form method="dialog" id="projectForm">
    <h3 style="margin:0 0 4px;font-size:15px;">グループを作成</h3>
    <label>グループ名</label>
    <input type="text" id="newProjectName" required autocomplete="off" placeholder="例: work">
    <div class="dialog-actions">
      <button type="button" class="ghost" id="projectCancel">キャンセル</button>
      <button type="submit" class="primary">作成</button>
    </div>
  </form>
</dialog>

<script>
const EXTRA_PROJECTS_KEY = "taskdeck.extraProjects";
function loadExtraProjects() {
  try { return new Set(JSON.parse(localStorage.getItem(EXTRA_PROJECTS_KEY) || "[]")); }
  catch { return new Set(); }
}
function saveExtraProjects() {
  try { localStorage.setItem(EXTRA_PROJECTS_KEY, JSON.stringify([...state.extraProjects])); }
  catch {}
}
const state = {
  tasks: [], project: "", dragging: null,
  extraProjects: loadExtraProjects(), panelId: null, runs: {},
};
const $ = (sel, el = document) => el.querySelector(sel);
const cols = {};
document.querySelectorAll(".col").forEach((c) => (cols[c.dataset.status] = c));
const PRIORITY_LABEL = { high: "高", medium: "中", low: "低" };

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function autosize(ta) {
  ta.style.height = "auto";
  ta.style.height = ta.scrollHeight + "px";
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...opts,
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function refresh() {
  const q = state.project ? `?project=${encodeURIComponent(state.project)}` : "";
  const [tasks, projects, runs] = await Promise.all([
    api(`/api/tasks${q}`),
    api("/api/projects"),
    api("/api/runs"),
  ]);
  state.tasks = tasks;
  state.runs = Object.fromEntries(runs.map((r) => [r.taskId, r]));
  renderProjects(projects);
  render();
  syncPanel();
}

function renderProjects(projects) {
  const sel = $("#projectFilter");
  const current = state.project;
  // タスクが付いてサーバー側に現れたグループは、ローカル保持分から外す
  const known = new Set(projects.map((p) => p.project));
  let changed = false;
  for (const name of state.extraProjects) {
    if (known.has(name)) { state.extraProjects.delete(name); changed = true; }
  }
  if (changed) saveExtraProjects();
  sel.replaceChildren();
  sel.add(new Option(`すべて (${projects.reduce((a, p) => a + p.open, 0)})`, ""));
  for (const p of projects) {
    sel.add(new Option(`${p.project} (${p.open})`, p.project));
  }
  for (const name of [...state.extraProjects].sort()) {
    sel.add(new Option(`${name} (0)`, name));
  }
  sel.value = current;
  if (sel.value !== current) { state.project = ""; sel.value = ""; }
}

function render() {
  for (const [status, col] of Object.entries(cols)) {
    const body = $(".col-body", col);
    body.replaceChildren();
    const tasks = state.tasks
      .filter((t) => t.status === status)
      .sort((a, b) => a.position - b.position || a.id - b.id);
    $(".count", col).textContent = tasks.length;
    if (!tasks.length) body.appendChild(el("div", "empty", "タスクなし"));
    for (const t of tasks) body.appendChild(cardEl(t));
  }
}

// ---- Markdown風レンダリング（メモ用） ----
// 入力テキストは最初に全てHTMLエスケープし、その後に整形タグのみを生成する。
// リンクのhrefは https?: で始まるものだけ許可するため、任意HTML/JSは注入できない。
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function mdInline(s) {
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/(^|[\s、。（(])(https?:\/\/[^\s<]+)/g,
    '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return s;
}
function mdRender(text) {
  const out = [];
  let list = null;
  const flush = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const line of escapeHtml(text).split("\n")) {
    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h) { flush(); out.push(`<h${h[1].length}>${mdInline(h[2])}</h${h[1].length}>`); continue; }
    const ul = line.match(/^[-*]\s+(.*)$/);
    if (ul) {
      if (list !== "ul") { flush(); out.push("<ul>"); list = "ul"; }
      out.push(`<li>${mdInline(ul[1])}</li>`); continue;
    }
    const ol = line.match(/^\d+[.)]\s+(.*)$/);
    if (ol) {
      if (list !== "ol") { flush(); out.push("<ol>"); list = "ol"; }
      out.push(`<li>${mdInline(ol[1])}</li>`); continue;
    }
    flush();
    if (!line.trim()) { out.push('<div class="md-gap"></div>'); continue; }
    out.push(`<p>${mdInline(line)}</p>`);
  }
  flush();
  return out.join("");
}
function mdPlain(s) {
  return s.replace(/\[([^\]]+)\]\([^)]*\)/g, "$1").replace(/[#*`]/g, "").trim();
}
// カード上のメモプレビュー（HTML保存分はテキスト化、Markdownは記号を除去）
function notesPreview(s) {
  if (!s) return "";
  if (/^\s*</.test(s)) {
    const body = new DOMParser().parseFromString(s, "text/html").body;
    return body.textContent.replace(/\u200B/g, "").trim();
  }
  return mdPlain(s);
}

// ---- カード ----
function cardEl(t) {
  const card = el("div", "card" + (t.status === "done" ? " done" : ""));
  card.draggable = true;
  card.dataset.id = t.id;
  if (t.id === state.panelId) card.classList.add("selected");

  const title = el("div", "title", t.title);
  title.title = "クリックしてタイトルを編集";
  card.appendChild(title);
  if (t.notes && notesPreview(t.notes)) card.appendChild(el("div", "notes", notesPreview(t.notes)));

  const meta = el("div", "meta");
  if (!state.project) meta.appendChild(el("span", "badge", t.project));
  if (t.priority) meta.appendChild(el("span", `chip p-${t.priority}`, PRIORITY_LABEL[t.priority]));
  const run = state.runs[t.id];
  if (run) {
    const label = { running: "🤖 実行中", done: "🤖 完了", error: "🤖 失敗", stopped: "🤖 停止" }[run.status];
    if (label) {
      const chip = el("span", `chip run-${run.status === "stopped" ? "error" : run.status}`, label);
      if (run.status === "running" && run.lastText) chip.title = run.lastText;
      if (run.error) chip.title = run.error;
      meta.appendChild(chip);
    }
  }
  meta.appendChild(el("span", "spacer"));
  if (run?.status === "running") {
    const stopBtn = el("button", "icon-btn", "⏹");
    stopBtn.title = "Claudeの実行を停止";
    stopBtn.onclick = async (e) => {
      e.stopPropagation();
      try { await api(`/api/tasks/${t.id}/dispatch/stop`, { method: "POST" }); }
      catch (err) { alert("停止に失敗: " + err.message); }
      refresh();
    };
    meta.appendChild(stopBtn);
  } else if (t.status !== "done") {
    const aiBtn = el("button", "icon-btn", "🤖");
    aiBtn.title = "Claude Codeに依頼";
    aiBtn.onclick = (e) => { e.stopPropagation(); openDispatchDialog(t); };
    meta.appendChild(aiBtn);
  }
  if (t.status !== "done") {
    const doneBtn = el("button", "icon-btn", "✓");
    doneBtn.title = "完了にする";
    doneBtn.onclick = async (e) => {
      e.stopPropagation();
      await api(`/api/tasks/${t.id}`, { method: "PATCH", body: JSON.stringify({ status: "done" }) });
      refresh();
    };
    meta.appendChild(doneBtn);
  }
  const moreBtn = el("button", "icon-btn", "⋯");
  moreBtn.title = "メニュー";
  moreBtn.onclick = (e) => { e.stopPropagation(); openMenu(moreBtn, t); };
  meta.appendChild(moreBtn);
  card.appendChild(meta);

  // タイトルクリック → その場で編集
  title.addEventListener("click", (e) => {
    e.stopPropagation();
    if (title.isContentEditable) return;
    startTitleEdit(card, title, t);
  });

  // カード本体クリック → 詳細パネル
  card.addEventListener("click", (e) => {
    if (e.target.closest("button") || e.target.closest("a")) return;
    if (title.isContentEditable) return;
    openPanel(t);
  });

  card.addEventListener("dragstart", (e) => {
    if (title.isContentEditable) { e.preventDefault(); return; }
    state.dragging = t;
    card.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", String(t.id));
  });
  card.addEventListener("dragend", () => {
    state.dragging = null;
    card.classList.remove("dragging");
    document.querySelectorAll(".col-body.dragover").forEach((b) => b.classList.remove("dragover"));
  });
  return card;
}

function startTitleEdit(card, title, t) {
  card.draggable = false;
  const original = t.title;
  try { title.contentEditable = "plaintext-only"; }
  catch { title.contentEditable = "true"; }
  title.focus();
  // カーソルを末尾に
  const range = document.createRange();
  range.selectNodeContents(title);
  range.collapse(false);
  const sel = getSelection();
  sel.removeAllRanges();
  sel.addRange(range);

  let cancelled = false;
  const finish = async () => {
    title.contentEditable = "false";
    title.removeAttribute("contenteditable");
    card.draggable = true;
    const text = title.textContent.trim();
    if (cancelled || !text || text === original) {
      title.textContent = original;
      return;
    }
    await api(`/api/tasks/${t.id}`, { method: "PATCH", body: JSON.stringify({ title: text }) });
    refresh();
  };
  title.addEventListener("blur", finish, { once: true });
  title.addEventListener("keydown", function onKey(e) {
    if (e.key === "Enter") { e.preventDefault(); title.blur(); }
    if (e.key === "Escape") { cancelled = true; title.blur(); }
    if (!title.isContentEditable) title.removeEventListener("keydown", onKey);
  });
}

// ---- カラム内クイック作成（Notionの「+ 新規」相当） ----
function openComposer(col) {
  const body = $(".col-body", col);
  const existing = $(".composer textarea", body);
  if (existing) { existing.focus(); return; }
  const comp = el("div", "card composer");
  const ta = document.createElement("textarea");
  ta.placeholder = "新しいタスク…（Enterで追加 / Escで閉じる）";
  comp.appendChild(ta);
  body.prepend(comp);
  ta.focus();

  let busy = false;
  const create = async (keepOpen) => {
    const title = ta.value.trim();
    if (!title || busy) return;
    busy = true;
    const status = col.dataset.status;
    const inCol = state.tasks.filter((x) => x.status === status);
    const created = await api("/api/tasks", {
      method: "POST",
      body: JSON.stringify({ title, project: state.project || "inbox", status }),
    });
    if (inCol.length) {
      const minPos = Math.min(...inCol.map((x) => x.position));
      await api(`/api/tasks/${created.id}`, {
        method: "PATCH", body: JSON.stringify({ position: minPos - 1024 }),
      });
    }
    await refresh();
    busy = false;
    if (keepOpen) openComposer(col);
  };
  ta.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); create(true); }
    else if (e.key === "Escape") { comp.remove(); }
  });
  ta.addEventListener("blur", () => {
    if (busy) return;
    if (ta.value.trim()) create(false);
    else comp.remove();
  });
}

// ---- ドラッグ&ドロップ ----
for (const [status, col] of Object.entries(cols)) {
  const body = $(".col-body", col);
  body.addEventListener("dragover", (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    body.classList.add("dragover");
  });
  body.addEventListener("dragleave", (e) => {
    if (!body.contains(e.relatedTarget)) body.classList.remove("dragover");
  });
  body.addEventListener("drop", async (e) => {
    e.preventDefault();
    body.classList.remove("dragover");
    const t = state.dragging;
    if (!t) return;
    const cards = [...body.querySelectorAll(".card")].filter(
      (c) => !c.classList.contains("composer") && Number(c.dataset.id) !== t.id
    );
    let insertBefore = null;
    for (const c of cards) {
      const rect = c.getBoundingClientRect();
      if (e.clientY < rect.top + rect.height / 2) { insertBefore = c; break; }
    }
    const inCol = state.tasks
      .filter((x) => x.status === status && x.id !== t.id)
      .sort((a, b) => a.position - b.position || a.id - b.id);
    let position;
    if (!inCol.length) {
      position = 1024;
    } else if (!insertBefore) {
      position = inCol[inCol.length - 1].position + 1024;
    } else {
      const idx = inCol.findIndex((x) => x.id === Number(insertBefore.dataset.id));
      const prev = idx > 0 ? inCol[idx - 1].position : inCol[idx].position - 2048;
      position = (prev + inCol[idx].position) / 2;
    }
    await api(`/api/tasks/${t.id}`, {
      method: "PATCH",
      body: JSON.stringify({ status, position }),
    });
    refresh();
  });
}

// ---- メモ: Notion風 WYSIWYG エディタ ----
const notesEditor = $("#notesEditor");
let notesDirty = false;
let notesSaveTimer = null;
let notesTaskId = null;
try { document.execCommand("defaultParagraphSeparator", false, "p"); } catch {}

// 保存/表示するHTMLはこのホワイトリストに通す（リンクは https?: のみ）
const ALLOWED_TAGS = new Set([
  "H1", "H2", "H3", "P", "DIV", "BR", "UL", "OL", "LI", "BLOCKQUOTE",
  "STRONG", "B", "EM", "I", "CODE", "A", "S", "U", "STRIKE",
]);
function sanitizeDoc(html) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  (function walk(node) {
    for (const child of [...node.childNodes]) {
      if (child.nodeType === Node.ELEMENT_NODE) {
        if (child.tagName === "SCRIPT" || child.tagName === "STYLE") {
          child.remove();
          continue;
        }
        if (!ALLOWED_TAGS.has(child.tagName)) {
          while (child.firstChild) node.insertBefore(child.firstChild, child);
          child.remove();
          continue;
        }
        const isLinkCard = child.tagName === "A" && child.classList.contains("link-card");
        for (const attr of [...child.attributes]) {
          if (child.tagName === "A" && attr.name === "href" &&
              /^https?:/i.test(child.getAttribute("href") || "")) continue;
          child.removeAttribute(attr.name);
        }
        if (child.tagName === "A") {
          if (!child.getAttribute("href")) {
            while (child.firstChild) node.insertBefore(child.firstChild, child);
            child.remove();
            continue;
          }
          child.setAttribute("target", "_blank");
          child.setAttribute("rel", "noopener");
          if (isLinkCard) child.setAttribute("class", "link-card");
        }
        walk(child);
      } else if (child.nodeType !== Node.TEXT_NODE) {
        child.remove();
      }
    }
  })(doc.body);
  return doc;
}
function looksLikeHtml(s) { return /^\s*</.test(s); }

function setEditorNotes(notes, id) {
  notesTaskId = id ?? state.panelId;
  const raw = notes && notes.trim() ? (looksLikeHtml(notes) ? notes : mdRender(notes)) : "";
  const doc = sanitizeDoc(raw);
  notesEditor.replaceChildren(...doc.body.childNodes);
  // リンクカードはアトミックなブロックとして扱う（中にカーソルを入れない）
  for (const a of notesEditor.querySelectorAll("a.link-card")) a.contentEditable = "false";
}
function serializeEditor() {
  const doc = sanitizeDoc(notesEditor.innerHTML);
  if (!doc.body.textContent.replace(/\u200B/g, "").trim() && !doc.body.querySelector("a")) return "";
  return doc.body.innerHTML.replace(/\u200B/g, "");
}
function scheduleNotesSave() {
  clearTimeout(notesSaveTimer);
  notesSaveTimer = setTimeout(saveNotes, 800);
}
async function saveNotes() {
  clearTimeout(notesSaveTimer);
  if (!notesDirty || notesTaskId == null) return;
  notesDirty = false;
  const html = serializeEditor();
  const t = state.tasks.find((x) => x.id === notesTaskId);
  if (t && html === (t.notes || "")) return;
  await api(`/api/tasks/${notesTaskId}`, {
    method: "PATCH", body: JSON.stringify({ notes: html }),
  });
  await refresh();
}
notesEditor.addEventListener("input", () => {
  notesDirty = true;
  scheduleNotesSave();
  inlineMarkdownRule();
});
notesEditor.addEventListener("blur", () => saveNotes());

// リンクはクリックで開く（Notionと同じ）
notesEditor.addEventListener("click", (e) => {
  const a = e.target.closest("a");
  if (a && notesEditor.contains(a)) {
    e.preventDefault();
    window.open(a.href, "_blank", "noopener");
  }
});

// 現在のカーソル位置のブロック要素（エディタ直下）を返す
function currentBlock(container) {
  let n = container.nodeType === Node.TEXT_NODE ? container.parentNode : container;
  while (n && n !== notesEditor && n.parentNode !== notesEditor) n = n.parentNode;
  return n === notesEditor ? null : n;
}

// 行頭の「# 」「- 」「1. 」などをスペース入力時に変換
function maybeBlockRule(e) {
  const sel = getSelection();
  if (!sel.rangeCount || !sel.isCollapsed) return;
  const r = sel.getRangeAt(0);
  const block = currentBlock(r.startContainer);
  const scope = block || notesEditor;
  const pre = document.createRange();
  pre.selectNodeContents(scope);
  pre.setEnd(r.startContainer, r.startOffset);
  const text = pre.toString().replace(/\u200B/g, "");
  const rules = [
    [/^#$/, () => document.execCommand("formatBlock", false, "h1")],
    [/^##$/, () => document.execCommand("formatBlock", false, "h2")],
    [/^###$/, () => document.execCommand("formatBlock", false, "h3")],
    [/^[-*]$/, () => document.execCommand("insertUnorderedList")],
    [/^1[.)]$/, () => document.execCommand("insertOrderedList")],
    [/^>$/, () => document.execCommand("formatBlock", false, "blockquote")],
  ];
  for (const [re, apply] of rules) {
    if (!re.test(text)) continue;
    e.preventDefault();
    pre.deleteContents();
    apply();
    notesDirty = true;
    scheduleNotesSave();
    return;
  }
}

// **太字** / *斜体* / `コード` を閉じた瞬間に変換
function inlineMarkdownRule() {
  const sel = getSelection();
  if (!sel.rangeCount || !sel.isCollapsed) return;
  const node = sel.focusNode;
  if (!node || node.nodeType !== Node.TEXT_NODE) return;
  if (node.parentNode.closest?.("code")) return;
  const upto = node.textContent.slice(0, sel.focusOffset);
  const rules = [
    [/\*\*([^*\s][^*]*)\*\*$/, "strong", 1],
    [/(^|[^*])\*([^*\s][^*]*)\*$/, "em", 2],
    [/`([^`]+)`$/, "code", 1],
  ];
  for (const [re, tag, group] of rules) {
    const m = upto.match(re);
    if (!m) continue;
    const inner = m[group];
    const matchLen = group === 2 ? m[0].length - m[1].length : m[0].length;
    const start = sel.focusOffset - matchLen;
    const range = document.createRange();
    range.setStart(node, start);
    range.setEnd(node, sel.focusOffset);
    range.deleteContents();
    const wrap = document.createElement(tag);
    wrap.textContent = inner;
    range.insertNode(wrap);
    const after = document.createTextNode("\u200B");
    wrap.parentNode.insertBefore(after, wrap.nextSibling);
    const nr = document.createRange();
    nr.setStart(after, 1);
    nr.collapse(true);
    sel.removeAllRanges();
    sel.addRange(nr);
    notesDirty = true;
    scheduleNotesSave();
    return;
  }
}

function toggleInlineCode() {
  const sel = getSelection();
  if (!sel.rangeCount) return;
  const r = sel.getRangeAt(0);
  const base = r.startContainer.nodeType === Node.TEXT_NODE
    ? r.startContainer.parentNode : r.startContainer;
  const existing = base.closest?.("code");
  if (existing && notesEditor.contains(existing)) {
    const parent = existing.parentNode;
    while (existing.firstChild) parent.insertBefore(existing.firstChild, existing);
    existing.remove();
    notesDirty = true;
    scheduleNotesSave();
    return;
  }
  if (r.collapsed) return;
  try {
    const code = document.createElement("code");
    r.surroundContents(code);
    notesDirty = true;
    scheduleNotesSave();
  } catch { /* 複数要素にまたがる選択は非対応 */ }
}

// Notion風ショートカット
notesEditor.addEventListener("keydown", (e) => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.altKey) {
    if (e.code === "Digit1") { e.preventDefault(); document.execCommand("formatBlock", false, "h1"); return; }
    if (e.code === "Digit2") { e.preventDefault(); document.execCommand("formatBlock", false, "h2"); return; }
    if (e.code === "Digit3") { e.preventDefault(); document.execCommand("formatBlock", false, "h3"); return; }
    if (e.code === "Digit0") { e.preventDefault(); document.execCommand("formatBlock", false, "p"); return; }
    return;
  }
  if (mod) {
    const k = e.key.toLowerCase();
    if (k === "b") { e.preventDefault(); document.execCommand("bold"); return; }
    if (k === "i") { e.preventDefault(); document.execCommand("italic"); return; }
    if (k === "e") { e.preventDefault(); toggleInlineCode(); return; }
    if (k === "s" && e.shiftKey) { e.preventDefault(); document.execCommand("strikeThrough"); return; }
    if (k === "k") { e.preventDefault(); openLinkPopup(); return; }
  }
  if (e.key === " ") maybeBlockRule(e);
});

// URL貼り付け → リンク化（選択中なら選択テキストに、空行ならリンクカード）
notesEditor.addEventListener("paste", (e) => {
  e.preventDefault();
  const raw = e.clipboardData.getData("text/plain") || "";
  const text = raw.trim();
  if (!text) return;
  if (/^https?:\/\/\S+$/i.test(text)) {
    const sel = getSelection();
    if (sel && !sel.isCollapsed) {
      document.execCommand("createLink", false, text);
      for (const a of notesEditor.querySelectorAll("a:not([target])")) {
        a.setAttribute("target", "_blank");
        a.setAttribute("rel", "noopener");
      }
    } else {
      const r = sel.rangeCount ? sel.getRangeAt(0) : null;
      const block = r ? currentBlock(r.startContainer) : null;
      const emptyLine = block
        ? !block.textContent.replace(/\u200B/g, "").trim()
        : !notesEditor.textContent.replace(/\u200B/g, "").trim();
      insertLinkNode(text, emptyLine);
    }
  } else {
    document.execCommand("insertText", false, raw);
  }
  notesDirty = true;
  scheduleNotesSave();
});

function insertLinkNode(url, asCard) {
  const a = document.createElement("a");
  a.href = url;
  a.target = "_blank";
  a.rel = "noopener";
  a.textContent = asCard ? "🔗 " + url : url;
  if (asCard) {
    a.className = "link-card";
    a.contentEditable = "false";
  }
  const sel = getSelection();
  if (sel.rangeCount && notesEditor.contains(sel.anchorNode)) {
    const r = sel.getRangeAt(0);
    r.deleteContents();
    r.insertNode(a);
    r.setStartAfter(a);
    r.collapse(true);
    sel.removeAllRanges();
    sel.addRange(r);
  } else {
    notesEditor.appendChild(a);
  }
  if (asCard && !a.nextElementSibling) {
    // カードの後に続けて書けるよう空段落を用意し、そこへカーソルを移す
    const p = document.createElement("p");
    p.appendChild(document.createElement("br"));
    a.parentNode.insertBefore(p, a.nextSibling);
    const nr = document.createRange();
    nr.setStart(p, 0);
    nr.collapse(true);
    sel.removeAllRanges();
    sel.addRange(nr);
  }
}

// ⌘K のリンク入力ポップアップ
const linkPopup = $("#linkPopup");
const linkInput = $("#linkInput");
let savedLinkRange = null;
function openLinkPopup() {
  const sel = getSelection();
  if (!sel.rangeCount) return;
  savedLinkRange = sel.getRangeAt(0).cloneRange();
  linkPopup.hidden = false;
  const rect = savedLinkRange.getBoundingClientRect();
  let x = rect.left;
  let y = rect.bottom + 6;
  if (!rect.width && !rect.height) {
    const er = notesEditor.getBoundingClientRect();
    x = er.left;
    y = er.top + 4;
  }
  x = Math.min(x, innerWidth - linkPopup.offsetWidth - 8);
  y = Math.min(y, innerHeight - linkPopup.offsetHeight - 8);
  linkPopup.style.left = `${x}px`;
  linkPopup.style.top = `${y}px`;
  linkInput.value = "";
  linkInput.focus();
}
function closeLinkPopup() { linkPopup.hidden = true; savedLinkRange = null; }
linkInput.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { e.preventDefault(); closeLinkPopup(); notesEditor.focus(); return; }
  if (e.key !== "Enter") return;
  e.preventDefault();
  let url = linkInput.value.trim();
  const range = savedLinkRange;
  closeLinkPopup();
  if (!url) { notesEditor.focus(); return; }
  if (!/^https?:\/\//i.test(url)) url = "https://" + url;
  notesEditor.focus();
  const sel = getSelection();
  sel.removeAllRanges();
  if (range) sel.addRange(range);
  if (range && !range.collapsed) {
    document.execCommand("createLink", false, url);
    for (const a of notesEditor.querySelectorAll("a:not([target])")) {
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    }
  } else {
    insertLinkNode(url, false);
  }
  notesDirty = true;
  scheduleNotesSave();
});
document.addEventListener("mousedown", (e) => {
  if (!linkPopup.hidden && !e.target.closest("#linkPopup")) closeLinkPopup();
});

// ---- … メニュー ----
const cardMenu = $("#cardMenu");
let menuTask = null;
function openMenu(anchor, t) {
  menuTask = t;
  $("#menuDone").style.display = t.status === "done" ? "none" : "";
  cardMenu.hidden = false;
  const r = anchor.getBoundingClientRect();
  const mw = cardMenu.offsetWidth;
  const mh = cardMenu.offsetHeight;
  let x = r.left;
  let y = r.bottom + 4;
  if (x + mw > innerWidth - 8) x = innerWidth - mw - 8;
  if (y + mh > innerHeight - 8) y = r.top - mh - 4;
  cardMenu.style.left = `${x}px`;
  cardMenu.style.top = `${y}px`;
}
function hideMenu() { cardMenu.hidden = true; menuTask = null; }
document.addEventListener("click", (e) => {
  if (!cardMenu.hidden && !e.target.closest("#cardMenu")) hideMenu();
}, true);
$("#menuDone").onclick = async () => {
  const t = menuTask;
  hideMenu();
  if (!t) return;
  await api(`/api/tasks/${t.id}`, { method: "PATCH", body: JSON.stringify({ status: "done" }) });
  refresh();
};
$("#menuDelete").onclick = () => {
  const t = menuTask;
  hideMenu();
  if (t) removeTask(t);
};

// ---- 削除 + 元に戻す（Notion風: 確認なし・Undo可能） ----
const toast = $("#toast");
let toastTimer = null;
let lastDeleted = null;
async function removeTask(t) {
  await api(`/api/tasks/${t.id}`, { method: "DELETE" });
  lastDeleted = t;
  if (state.panelId === t.id) closePanel();
  await refresh();
  $(".msg", toast).textContent = `「${t.title}」を削除しました`;
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.hidden = true; }, 6000);
}
$("#toastUndo").onclick = async () => {
  toast.hidden = true;
  clearTimeout(toastTimer);
  const t = lastDeleted;
  lastDeleted = null;
  if (!t) return;
  await api("/api/tasks", {
    method: "POST",
    body: JSON.stringify({
      title: t.title, notes: t.notes, project: t.project,
      status: t.status, priority: t.priority || "",
    }),
  });
  refresh();
};

// ---- キーボード / ライブ更新 ----
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!cardMenu.hidden) { hideMenu(); return; }
  const ae = document.activeElement;
  if (ae && ae.isContentEditable) { ae.blur(); return; }
  if (ae && ["INPUT", "TEXTAREA"].includes(ae.tagName)) return;
  if ($("#projectDialog").open) return;
  if (!panel.hidden) closePanel();
});

const es = new EventSource("/api/events");
es.onmessage = () => {
  if (state.dragging) return;
  if ($("#projectDialog").open || $("#dispatchDialog").open) return;
  const ae = document.activeElement;
  if (ae && (ae.isContentEditable || ae.closest?.("#panel") || ae.closest?.(".composer"))) return;
  refresh();
};

refresh();
</script>
