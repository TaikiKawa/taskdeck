# PR と main への push で、依存の取得・構文チェック・サーバー起動のスモークテストを行う。
# 外部入力 (PR タイトルや本文) は一切使わない。書き込み権限は持たない。
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: node --check src/server.js && node --check src/db.js && node --check src/dispatch.js && node --check src/mcp.js && node --check scripts/register-mcp.js && node --check scripts/package.mjs
      - name: Tests (server smoke test + cross-site protection)
        run: npm test
