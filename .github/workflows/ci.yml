# PR と main への push で、依存の取得・構文チェック・サーバー起動のスモークテストを行う。
# 外部入力 (PR タイトルや本文) は一切使わない。書き込み権限は持たない。
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: node --check src/server.js && node --check src/db.js && node --check src/dispatch.js && node --check src/mcp.js && node --check scripts/register-mcp.js && node --check scripts/package.mjs
      - name: Tests (server smoke test + cross-site protection)
        run: npm test
