# タグ v* を push すると macOS (universal) と Windows (x64) の配布 zip をビルドし、
# GitHub Release に添付する。ソースコードの zip / tar.gz は GitHub が自動で付ける。
#
# macOS 版は Repository secrets に以下が登録されているときだけビルドする (無ければ macOS ジョブはスキップし、
# 手元で `SIGN_IDENTITY=... NOTARY_PROFILE=... node scripts/package.mjs --platform darwin` で作った zip を
# `gh release upload` で添付する):
#   MACOS_CERTIFICATE_P12       Developer ID Application 証明書 (.p12) を base64 にしたもの
#   MACOS_CERTIFICATE_PASSWORD  .p12 のパスワード
#   MACOS_SIGN_IDENTITY         例: "Developer ID Application: Alche, inc. (GS68A638AG)"
#   APPLE_ID                    Apple ID (メールアドレス)
#   APPLE_TEAM_ID               例: GS68A638AG
#   APPLE_APP_PASSWORD          appleid.apple.com で発行した App 用パスワード
#
# 外部入力 (issue / PR 本文など) は一切使わない。secrets は env 経由でのみ参照する。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_MAJOR: "22"

jobs:
  # 署名用 secrets が無いときは macOS ジョブを丸ごとスキップする。
  # (ad-hoc 署名の zip を Release に載せると、手元で公証した同名の zip を上書きしてしまうため)
  prep:
    runs-on: ubuntu-latest
    outputs:
      mac_signing: ${{ steps.chk.outputs.mac_signing }}
    steps:
      - id: chk
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        run: |
          if [ -n "$P12" ]; then echo "mac_signing=true" >> "$GITHUB_OUTPUT"; else echo "mac_signing=false" >> "$GITHUB_OUTPUT"; fi

  mac:
    needs: prep
    if: needs.prep.outputs.mac_signing == 'true'
    runs-on: macos-14
    env:
      HAS_CERT: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_MAJOR }}
          cache: npm
      - run: npm ci

      - name: Import Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KC_PASS="$(openssl rand -hex 16)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Package (sign + notarize when secrets are present)
        env:
          SIGN_IDENTITY: ${{ env.HAS_CERT == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: node scripts/package.mjs --platform darwin --arch universal

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac
          path: dist/*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_MAJOR }}
          cache: npm
      - run: npm ci
      - run: node scripts/package.mjs --platform win32 --arch x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: [prep, mac, windows]
    # mac がスキップされても Windows だけで Release を作る (macOS zip は手元で公証したものを添付する)
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.windows.result == 'success' &&
      (needs.mac.result == 'success' || needs.mac.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          # 手元で公証して先に添付した macOS zip を CI が上書きしないようにする
          overwrite_files: false
