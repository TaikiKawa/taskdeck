name: バグ報告
description: 動作がおかしい・起動しない・エラーが出る
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        脆弱性に関わる内容は Issue に書かず、[SECURITY.md](../blob/main/SECURITY.md) の手順で非公開に報告してください。
  - type: input
    id: version
    attributes:
      label: バージョン
      description: Release のタグ（例 v0.1.0）、またはコミット
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS / 使い方
      options:
        - macOS（配布版 .app）
        - macOS（ソースからビルド）
        - Windows（配布版 zip）
        - Windows（ソースから）
        - ブラウザ（npm run ui）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: 1. … 2. … 3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
  - type: textarea
    id: logs
    attributes:
      label: ログ・エラー
      description: "`~/.taskdeck/server.err.log`（Windows）やターミナルの出力。**トークンやホームディレクトリ名など個人情報は伏せてください**"
      render: text
